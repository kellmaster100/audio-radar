<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioRadar - Interactive Aircraft Tracker</title>
    <style>
        body { background-color: #000; color: #FFF; font-family: sans-serif; padding: 20px; line-height: 1.6; }
        h1 { color: #FFFF00; border-bottom: 2px solid #FFFF00; padding-bottom: 10px; }
        button { background-color: #FFFF00; color: #000; font-weight: bold; padding: 12px 20px; border: 2px solid #FFF; cursor: pointer; margin: 10px 0; font-size: 1rem; }
        button:focus { outline: 4px solid #00FF00; }
        .flight-card { border: 2px solid #FFF; margin-bottom: 15px; padding: 15px; background: #111; }
        .tracking-box { border: 4px solid #00FF00; padding: 20px; margin-bottom: 20px; background: #001a00; }
        .hidden { display: none; }
        .btn-track { background-color: #00FF00; color: #000; margin-left: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>AudioRadar</h1>
        <p>Using your GPS to find the 10 closest aircraft.</p>
    </header>

    <main>
        <section id="announcer" role="status" aria-live="polite" class="hidden"></section>
        
        <div id="tracking-section" class="hidden" aria-labelledby="track-heading">
            <h2 id="track-heading">Currently Tracking</h2>
            <div id="active-tracker" class="tracking-box" role="region" aria-live="assertive">
                </div>
            <button onclick="stopTracking()">Stop Tracking</button>
        </div>

        <button onclick="getLocationAndFetch()">Scan for Nearby Planes</button>

        <section id="flight-list-container">
            <h2 id="list-header">Nearby Aircraft</h2>
            <div id="flight-list" role="list">
                <p>Press "Scan" to begin.</p>
            </div>
        </section>
    </main>

    <script>
        let userLat, userLon;
        let trackingInterval = null;
        let trackedIcao = null;

        const announcer = document.getElementById('announcer');
        const flightList = document.getElementById('flight-list');
        const trackingSection = document.getElementById('tracking-section');
        const activeTracker = document.getElementById('active-tracker');

        async function getLocationAndFetch() {
            announcer.textContent = "Requesting your GPS location...";
            
            if (!navigator.geolocation) {
                announcer.textContent = "Geolocation is not supported by your browser.";
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                userLat = position.coords.latitude;
                userLon = position.coords.longitude;
                fetchFlights();
            }, (error) => {
                announcer.textContent = "Error: GPS permission denied.";
            });
        }

        async function fetchFlights() {
            announcer.textContent = "Searching for aircraft within 25 miles...";
            try {
                const response = await fetch(`/api/flights?lat=${userLat}&lon=${userLon}`);
                const flights = await response.json();

                if (!flights.length) {
                    flightList.innerHTML = "<p>No aircraft found in your area right now.</p>";
                    announcer.textContent = "No aircraft detected.";
                    return;
                }

                flightList.innerHTML = "";
                flights.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'flight-card';
                    card.setAttribute('role', 'listitem');
                    card.innerHTML = `
                        <strong>Callsign: ${f.callsign}</strong><br>
                        Distance: ${f.distance} miles away<br>
                        Altitude: ${f.altitude} ft<br>
                        <button class="btn-track" onclick="startTracking('${f.icao24}', '${f.callsign}')">
                            Track ${f.callsign}
                        </button>
                    `;
                    flightList.appendChild(card);
                });

                announcer.textContent = `Found ${flights.length} planes. Listed from closest to farthest.`;
            } catch (err) {
                announcer.textContent = "Error fetching flight data.";
            }
        }

        async function startTracking(icao, callsign) {
            trackedIcao = icao;
            trackingSection.classList.remove('hidden');
            announcer.textContent = `Now tracking flight ${callsign}.`;
            
            // Initial update
            updateTrackedPlane();
            
            // Update every 10 seconds
            if(trackingInterval) clearInterval(trackingInterval);
            trackingInterval = setInterval(updateTrackedPlane, 10000);
            
            // Scroll to top to see tracking info
            window.scrollTo(0, 0);
        }

        async function updateTrackedPlane() {
            try {
                // Fetch fresh data for the bounding box
                const response = await fetch(`/api/flights?lat=${userLat}&lon=${userLon}`);
                const flights = await response.json();
                const plane = flights.find(f => f.icao24 === trackedIcao);

                if (!plane) {
                    activeTracker.innerHTML = "<p>Lost contact with aircraft. It may have left the area.</p>";
                    return;
                }

                // Get street/neighborhood name from our new locate API
                const geoResponse = await fetch(`/api/locate?lat=${plane.lat}&lon=${plane.lon}`);
                const geoData = await geoResponse.json();

                activeTracker.innerHTML = `
                    <h3>${plane.callsign}</h3>
                    <p><strong>Location:</strong> Over ${geoData.location}</p>
                    <p><strong>Distance:</strong> ${plane.distance} miles away</p>
                    <p><strong>Altitude:</strong> ${plane.altitude} ft</p>
                `;
            } catch (err) {
                console.error("Tracking update failed", err);
            }
        }

        function stopTracking() {
            clearInterval(trackingInterval);
            trackingSection.classList.add('hidden');
            trackedIcao = null;
            announcer.textContent = "Stopped tracking.";
        }
    </script>
</body>
</html>
