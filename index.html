<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioRadar - Authenticated Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 20px; background-color: #121212; color: #E0E0E0; line-height: 1.5;
        }
        h1 { text-align: center; color: #BB86FC; border-bottom: 2px solid #333; padding-bottom: 10px; }
        button { 
            width: 100%; padding: 20px; font-size: 1.3rem; margin-bottom: 12px;
            background-color: #1F1F1F; color: #FFFFFF; border: 2px solid #BB86FC; 
            border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        button:hover, button:focus { background-color: #BB86FC; color: #000; outline: 3px solid #FFF; }
        .track-btn { width: auto; padding: 12px 24px; background-color: #03DAC6; color: #000; border: none; margin-top: 10px; }
        #status-area { 
            margin: 20px 0; padding: 20px; border: 3px solid #03DAC6; 
            background-color: #1A1A1A; font-weight: bold; font-size: 1.2rem;
            color: #03DAC6; border-radius: 12px;
        }
        .flight-item { background: #1E1E1E; padding: 20px; margin-bottom: 15px; border: 2px solid #333; border-radius: 8px; list-style: none; }
        #map { height: 350px; width: 100%; margin-top: 20px; border: 2px solid #333; border-radius: 8px; background-color: #1a1a1a; }
    </style>
</head>
<body>
    <header><h1>AudioRadar ✈️</h1></header>
    <main>
        <button id="scan-button">Scan Sky for Nearby Aircraft</button>
        <button id="stop-track" style="display:none;">Stop Tracking & Return to List</button>
        <div id="status-area" role="status" aria-live="assertive">Status: Ready. Please enter credentials in code.</div>
        <ul id="results-list" aria-label="Flight List"></ul>
        <div id="map" aria-hidden="true"></div>
    </main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. YOUR CREDENTIALS ---
        const OS_ID = 'kellmaster1-api-client'; 
        const OS_SECRET = 'b0O8vDccf1QHAfoS0Mum48qnM8m9KQFY';
        const LOCATION_IQ_KEY = 'pk.7c1fe161475d3e7b1ba78f1f8a1b5859'; 

        const scanButton = document.getElementById('scan-button');
        const stopTrackBtn = document.getElementById('stop-track');
        const statusArea = document.getElementById('status-area');
        const resultsList = document.getElementById('results-list');

        let trackingInterval = null, trackedIcao = null, map, marker;

        // Initialize Map
        map = L.map('map', { zoomControl: false, keyboard: false }).setView([34.0522, -118.2437], 10); 
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap' }).addTo(map);
        marker = L.marker([0, 0]).addTo(map);

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8;
            const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function getDirection(lat1, lon1, lat2, lon2) {
            const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
            let bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            const dirs = ['North', 'North East', 'East', 'South East', 'South', 'South West', 'West', 'North West'];
            return dirs[Math.round(bearing / 45) % 8];
        }

        async function handleScan() {
            statusArea.innerText = "Status: Locating you...";
            resultsList.innerHTML = "";
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const myLat = pos.coords.latitude, myLon = pos.coords.longitude;
                map.setView([myLat, myLon], 10);
                statusArea.innerText = "Status: Scanning Sky...";

                try {
                    const apiTarget = `https://opensky-network.org/api/states/all?lamin=${myLat-0.5}&lomin=${myLon-0.5}&lamax=${myLat+0.5}&lomax=${myLon+0.5}`;
                    
                    // We encode your ID and Secret into a "Basic Auth" string
                    const auth = btoa(`${OS_ID}:${OS_SECRET}`);

                    // We use the "raw" AllOrigins proxy which is often better for headers
                    const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(apiTarget)}`, {
                        headers: { 'Authorization': `Basic ${auth}` }
                    });

                    if (!response.ok) throw new Error("Server rejected request");
                    const data = await response.json();
                    
                    if (!data.states) { statusArea.innerText = "No planes found."; return; }
                    
                    const planes = data.states.map(p => ({
                        icao: p[0], callsign: (p[1] || "UNK").trim(),
                        dist: calculateDistance(myLat, myLon, p[6], p[5]),
                        dir: getDirection(myLat, myLon, p[6], p[5]), alt: p[7] ? Math.round(p[7] * 3.28084) : 0
                    })).sort((a, b) => a.dist - b.dist);

                    planes.slice(0, 10).forEach(p => {
                        const li = document.createElement('li'); li.className = 'flight-item';
                        li.innerHTML = `<strong>Flight ${p.callsign}</strong><br>${p.dist.toFixed(1)} miles ${p.dir}, ${p.alt} ft.<br><button class="track-btn" onclick="startTracking('${p.icao}', '${p.callsign}')">Track ${p.callsign}</button>`;
                        resultsList.appendChild(li);
                    });
                    statusArea.innerText = `Status: Found ${planes.length} planes.`;
                } catch (err) { 
                    console.error(err);
                    statusArea.innerText = "Status: Scan error. Try again."; 
                }
            });
        }

        window.startTracking = function(icao, callsign) {
            trackedIcao = icao; scanButton.style.display = 'none'; stopTrackBtn.style.display = 'block';
            resultsList.innerHTML = ""; statusArea.innerText = `Status: Locking onto ${callsign}...`;
            performTrackUpdate(); trackingInterval = setInterval(performTrackUpdate, 10000);
        };

        async function performTrackUpdate() {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const myLat = pos.coords.latitude, myLon = pos.coords.longitude;
                try {
                    const apiTarget = `https://opensky-network.org/api/states/all?lamin=${myLat-0.5}&lomin=${myLon-0.5}&lamax=${myLat+0.5}&lomax=${myLon+0.5}`;
                    const auth = btoa(`${OS_ID}:${OS_SECRET}`);
                    
                    const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(apiTarget)}`, {
                        headers: { 'Authorization': `Basic ${auth}` }
                    });
                    const data = await response.json();
                    const plane = data.states ? data.states.find(p => p[0] === trackedIcao) : null;
                    
                    if (plane) {
                        const callsign = (plane[1] || "UNK").trim(), pLat = plane[6], pLon = plane[5];
                        const dist = calculateDistance(myLat, myLon, pLat, pLon).toFixed(1);
                        const dir = getDirection(myLat, myLon, pLat, pLon);
                        const alt = plane[7] ? Math.round(plane[7] * 3.28084) : "unknown";
                        map.setView([pLat, pLon], 13);
                        marker.setLatLng([pLat, pLon]).bindPopup(`Flight ${callsign}`).openPopup();
                        statusArea.innerText = `Flight ${callsign}: ${dist} miles ${dir}, alt ${alt} ft.`;
                    }
                } catch (err) { statusArea.innerText = "Status: Tracking error."; }
            });
        }

        function stopTracking() {
            clearInterval(trackingInterval); trackedIcao = null;
            stopTrackBtn.style.display = 'none'; scanButton.style.display = 'block';
            handleScan();
        }

        scanButton.addEventListener('click', handleScan);
        stopTrackBtn.addEventListener('click', stopTracking);
    </script>
</body>
</html>
