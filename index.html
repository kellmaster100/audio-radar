<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioRadar - Riverside Aircraft Tracker</title>
    <style>
        body { background-color: #000; color: #FFF; font-family: sans-serif; padding: 20px; }
        .flight-card { border: 2px solid #FFF; margin-bottom: 10px; padding: 15px; }
        button { background-color: #FFFF00; color: #000; font-weight: bold; padding: 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>AudioRadar: Riverside Flight Tracker</h1>
    </header>

    <main>
        <button onclick="fetchFlights()">Refresh Flight Data</button>
        
        <div id="status" role="status" aria-live="polite" style="margin-top: 10px;"></div>

        <section id="flight-list" aria-label="Current Flights">
            </section>
    </main>

    <script>
        async function fetchFlights() {
            const status = document.getElementById('status');
            const list = document.getElementById('flight-list');
            
            status.textContent = "Updating flight list...";
            
            try {
                // We now call our internal Vercel API instead of OpenSky directly
                const response = await fetch('/api/flights');
                const data = await response.json();
                
                list.innerHTML = '';
                
                if (!data.states || data.states.length === 0) {
                    status.textContent = "No aircraft detected in the Riverside area.";
                    return;
                }

                data.states.forEach(flight => {
                    const callsign = flight[1] || "Unknown";
                    const altitude = flight[7] ? Math.round(flight[7] * 3.28084) + " ft" : "Unknown altitude";
                    
                    const div = document.createElement('div');
                    div.className = 'flight-card';
                    div.innerHTML = `<strong>Callsign: ${callsign}</strong><br>Altitude: ${altitude}`;
                    list.appendChild(div);
                });

                status.textContent = `Update complete. Found ${data.states.length} aircraft.`;
            } catch (err) {
                status.textContent = "Error loading flight data.";
                console.error(err);
            }
        }

        // Initial load
        fetchFlights();
    </script>
</body>
</html>
