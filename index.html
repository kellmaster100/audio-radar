<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Radar</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .controls { display: flex; flex-direction: column; gap: 10px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
        input { padding: 10px; font-size: 16px; }
        button { padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; }
        #status { margin-top: 15px; font-weight: bold; min-height: 1.2em; }
        .flight-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
</head>
<body>

    <h1>Audio Radar</h1>

    <div class="controls">
        <label for="lat">Latitude</label>
        <input type="number" id="lat" value="33.9854" step="0.0001">
        
        <label for="lon">Longitude</label>
        <input type="number" id="lon" value="-117.3659" step="0.0001">

        <button id="scan-btn" onclick="scanForFlights()">Scan for Aircraft</button>
        <div id="status" aria-live="polite">Ready to scan.</div>
    </div>

    <div id="flight-list" aria-live="polite">
        </div>

    <script>
        // --- DISTANCE MATH ---
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        // --- UI UPDATE ---
        function updateFlightList(flights) {
            const list = document.getElementById('flight-list');
            list.innerHTML = '';
            if (flights.length === 0) return;

            flights.forEach(f => {
                const item = document.createElement('div');
                item.className = 'flight-item';
                item.innerHTML = `<strong>${f.callsign}</strong> - ${f.distance} miles away, ${f.altitude} feet`;
                list.appendChild(item);
            });
        }

        // --- MAIN FUNCTION ---
        async function scanForFlights() {
            const status = document.getElementById('status');
            const btn = document.getElementById('scan-btn');
            
            // 1. Visual/Audio feedback immediately
            status.innerText = "Scanning now...";
            btn.disabled = true;

            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);

            /* --- VERCEL METHOD PAUSED ---
            // const response = await fetch(`/api/flights?lat=${lat}&lon=${lon}`);
            */

            // 2. Browser Direct Setup
            const offset = 0.25;
// Switching to a different public proxy that is usually more reliable
const proxy = "https://api.allorigins.win/raw?url=";
const target = `https://opensky-network.org/api/states/all?lamin=${lat-offset}&lomin=${lon-offset}&lamax=${lat+offset}&lomax=${lon+offset}`;

            try {
                const response = await fetch(proxy + encodeURIComponent(target));
                const data = await response.json();
                
                if (!data.states || data.states.length === 0) {
                    status.innerText = "No aircraft found in the Riverside area.";
                    updateFlightList([]);
                } else {
                    const flights = data.states.map(f => {
                        return {
                            icao24: f[0],
                            callsign: f[1] ? f[1].trim() : "Unknown",
                            altitude: f[7] ? Math.round(f[7] * 3.28084) : 0,
                            distance: calculateDistance(lat, lon, f[6], f[5]).toFixed(1)
                        };
                    });
                    const sorted = flights.sort((a, b) => a.distance - b.distance).slice(0, 10);
                    status.innerText = `Found ${sorted.length} aircraft.`;
                    updateFlightList(sorted);
                }
            } catch (err) {
                console.error(err);
                status.innerText = "Connection error. Please try again.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
