<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Radar v2 - Live Tracking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { 
            font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; 
            background-color: #121212; color: #E0E0E0; 
        }
        .controls { 
            display: flex; flex-direction: column; gap: 10px; border: 2px solid #333; 
            padding: 15px; border-radius: 8px; background-color: #1e1e1e; 
        }
        input { padding: 10px; font-size: 16px; background: #2a2a2a; color: white; border: 1px solid #444; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { 
            flex: 1; padding: 15px; background-color: #f39c12; color: #000; border: none; 
            border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; 
        }
        button:disabled { background-color: #555; color: #888; }
        .loc-btn { background-color: #3498db; color: white; }
        .stop-btn { background-color: #e74c3c; color: white; margin-top: 10px; display: none; }
        
        #status { margin-top: 15px; font-weight: bold; color: #f39c12; min-height: 1.2em; }
        
        .flight-item { 
            border-bottom: 1px solid #333; padding: 15px 0; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .track-btn { padding: 10px 15px; font-size: 16px; background-color: #3498db; color: white; border-radius: 4px; border: none; }
        
        #map { height: 350px; width: 100%; margin-top: 20px; border-radius: 8px; border: 2px solid #333; }
    </style>
</head>
<body>

    <h1>Audio Radar</h1>

    <div class="controls">
        <label for="lat">Latitude</label>
        <input type="number" id="lat" value="33.9854" step="0.0001">
        
        <label for="lon">Longitude</label>
        <input type="number" id="lon" value="-117.3659" step="0.0001">

        <div class="btn-group">
            <button id="loc-btn" class="loc-btn" onclick="getLocation()">Use My Location</button>
            <button id="scan-btn" onclick="scanForFlights()">Scan Airspace</button>
        </div>
        <button id="stop-btn" class="stop-btn" onclick="stopTracking()">Stop Tracking</button>
        <div id="status" aria-live="polite">Ready to scan.</div>
    </div>

    <div id="map" aria-hidden="true"></div>
    <div id="flight-list" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, markerLayer, userMarker;
    let trackingInterval = null;
    let trackedIcao = null;
    let trackedCallsign = null;

    function initMap() {
        const startLat = parseFloat(document.getElementById('lat').value);
        const startLon = parseFloat(document.getElementById('lon').value);
        if (map) map.remove();
        
        map = L.map('map').setView([startLat, startLon], 11);
        
        // Using CartoDB Dark Matter tiles for high contrast
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);
        
        markerLayer = L.layerGroup().addTo(map);
        updateUserMarker(startLat, startLon);
    }

    // UPDATED: Modern visual marker for the User's location
    function updateUserMarker(lat, lon) {
        if (userMarker) map.removeLayer(userMarker);
        
        userMarker = L.circleMarker([lat, lon], {
            radius: 10,
            fillColor: "#3498db",
            color: "#fff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.8
        }).addTo(map).bindPopup("Your Location");
        
        map.setView([lat, lon], 12);
    }

    function getLocation() {
        const status = document.getElementById('status');
        if (!navigator.geolocation) {
            status.innerText = "Geolocation is not supported by your browser.";
            return;
        }

        status.innerText = "Acquiring location... check browser permissions.";
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude.toFixed(4);
                const lon = position.coords.longitude.toFixed(4);
                document.getElementById('lat').value = lat;
                document.getElementById('lon').value = lon;
                status.innerText = `Location found: ${lat}, ${lon}.`;
                updateUserMarker(lat, lon);
                scanForFlights();
            },
            (error) => {
                status.innerText = "Unable to retrieve location. Please enter coordinates manually.";
                console.error(error);
            }
        );
    }

    initMap();

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    async function getStreetName(lat, lon) {
        try {
            const res = await fetch(`/api/locate?lat=${lat}&lon=${lon}`);
            const data = await res.json();
            return data.location || "Unknown area";
        } catch {
            return "Unknown area";
        }
    }

    function stopTracking() {
        if (trackingInterval) clearInterval(trackingInterval);
        trackingInterval = null;
        trackedIcao = null;
        trackedCallsign = null;
        document.getElementById('stop-btn').style.display = 'none';
        document.getElementById('status').innerText = "Tracking stopped.";
    }

    async function trackFlight(icao24, callsign) {
        if (trackingInterval) clearInterval(trackingInterval);
        trackedIcao = icao24.toLowerCase().trim();
        trackedCallsign = callsign.trim();
        document.getElementById('stop-btn').style.display = 'block';
        const status = document.getElementById('status');
        
        const runUpdate = async () => {
            const uLat = parseFloat(document.getElementById('lat').value);
            const uLon = parseFloat(document.getElementById('lon').value);
            try {
                const response = await fetch(`/api/flights?lat=${uLat}&lon=${uLon}`);
                const data = await response.json();
                const target = data.find(f => {
                    const fIcao = (f.icao24 || f.hex || "").toLowerCase().trim();
                    const fCall = (f.callsign || "").trim();
                    return fIcao === trackedIcao || fCall === trackedCallsign;
                });
                if (target) {
                    const street = await getStreetName(target.lat, target.lon);
                    const dist = calculateDistance(uLat, uLon, target.lat, target.lon).toFixed(1);
                    status.innerText = `${trackedCallsign}: ${dist} mi, over ${street}. Alt: ${target.altitude}ft.`;
                    
                    markerLayer.clearLayers();
                    // Aircraft Marker: High visibility yellow for dark mode
                    L.circleMarker([target.lat, target.lon], {
                        radius: 8,
                        fillColor: "#f39c12",
                        color: "#000",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(markerLayer).bindPopup(trackedCallsign).openPopup();
                    
                    map.setView([target.lat, target.lon], 13);
                } else {
                    status.innerText = `Searching for ${trackedCallsign} signal...`;
                }
            } catch (err) { status.innerText = "Connection lost. Retrying..."; }
        };
        await runUpdate();
        trackingInterval = setInterval(runUpdate, 10000);
    }

    async function scanForFlights() {
        const status = document.getElementById('status');
        const btn = document.getElementById('scan-btn');
        const list = document.getElementById('flight-list');
        const lat = parseFloat(document.getElementById('lat').value);
        const lon = parseFloat(document.getElementById('lon').value);
        status.innerText = "Scanning nearby airspace...";
        btn.disabled = true;
        list.innerHTML = '';

        try {
            const response = await fetch(`/api/flights?lat=${lat}&lon=${lon}`);
            const data = await response.json();
            if (!data || data.length === 0) {
                status.innerText = "No aircraft found.";
            } else {
                const processed = data.map(f => ({
                    ...f,
                    distance: calculateDistance(lat, lon, f.lat, f.lon).toFixed(1)
                })).sort((a, b) => a.distance - b.distance).slice(0, 5);

                markerLayer.clearLayers(); // Clear old scan markers
                for (const f of processed) {
                    const street = await getStreetName(f.lat, f.lon);
                    
                    // Add aircraft to map
                    L.circleMarker([f.lat, f.lon], {
                        radius: 6,
                        fillColor: "#f39c12",
                        color: "#fff",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(markerLayer).bindPopup(f.callsign);

                    const item = document.createElement('div');
                    item.className = 'flight-item';
                    item.innerHTML = `
                        <div class="flight-info">
                            <h3>${f.callsign}</h3>
                            <p>${f.distance} miles away, over ${street}.</p>
                        </div>
                        <button class="track-btn" aria-label="Track ${f.callsign}" onclick="trackFlight('${f.icao24}', '${f.callsign}')">Track</button>
                    `;
                    list.appendChild(item);
                }
                status.innerText = `Found ${processed.length} aircraft nearby.`;
            }
        } catch (err) { status.innerText = "Error fetching flight data."; }
        finally { btn.disabled = false; }
    }
</script>
</body>
</html>
